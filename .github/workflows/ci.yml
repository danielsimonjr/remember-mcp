name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      # Syntax gate only. A full install + pytest is NOT possible in CI: the repo
      # pins requires-python==3.13.* but depends (transitively, via memvid) on
      # faiss-cpu==1.7.4 / numpy==1.26.4, which have no cp313 wheels (cp311 max),
      # and `memvid>=0.1.4` is not published on PyPI (tops out at 0.1.3). memvid
      # is archived, so its pins can't be fixed here. See CHANGELOG / issue tracker.
      # compileall byte-compiles every module so a syntax regression still fails CI.
      - run: python -m compileall -q .
