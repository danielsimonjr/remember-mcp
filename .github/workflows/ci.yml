name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the PRODUCTION platform for this MCP server (Daniel runs it
        # locally on Windows), but CI was Linux-only — it never tested the OS the
        # server actually ships on.
        os: [ubuntu-latest, windows-latest]

    # Run every `run:` step under bash on BOTH platforms. Windows would otherwise
    # default to PowerShell, which cannot parse the bash idiom below
    # (`pytest -q || [ $? -eq 5 ]`, which tolerates pytest's exit-5 "no tests
    # collected") — it fails with a ParserError before any test runs.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      # Syntax gate only. A full install + pytest is NOT possible in CI: the repo
      # pins requires-python==3.13.* but depends (transitively, via memvid) on
      # faiss-cpu==1.7.4 / numpy==1.26.4, which have no cp313 wheels (cp311 max),
      # and `memvid>=0.1.4` is not published on PyPI (tops out at 0.1.3). memvid
      # is archived, so its pins can't be fixed here. See CHANGELOG / issue tracker.
      # compileall byte-compiles every module so a syntax regression still fails CI.
      - run: python -m compileall -q .
