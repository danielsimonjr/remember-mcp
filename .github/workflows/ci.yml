name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the PRODUCTION platform for this MCP server (Daniel runs it
        # locally on Windows), but CI was Linux-only — it never tested the OS the
        # server actually ships on.
        os: [ubuntu-latest, windows-latest]

    # Run every `run:` step under bash on BOTH platforms. Windows would otherwise
    # default to PowerShell, which cannot parse the bash idiom below
    # (`pytest -q || [ $? -eq 5 ]`, which tolerates pytest's exit-5 "no tests
    # collected") — it fails with a ParserError before any test runs.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      # Kept as a fast fail: byte-compiles every module, so a syntax regression
      # dies in seconds instead of after the (large) dependency install below.
      - run: python -m compileall -q .

      # The old "a full install is NOT possible in CI" constraint is GONE. It cited
      # faiss-cpu==1.7.4 / numpy==1.26.4 (no cp313 wheels) and memvid being an
      # archived PyPI package capped at 0.1.3. All three premises expired: memvid
      # now resolves to danielsimonjr/memvid @ v0.2.0 over git, which pulls
      # faiss-cpu 1.13.2 and numpy 2.4.4 — both of which ship cp313 wheels.
      # Verified by `uv sync` succeeding on 3.13.14 before this change landed.
      #
      # This matters: the repo has real tests that had NEVER run in CI, so a
      # dependency regression could not be detected by the syntax gate alone.
      - run: pip install --disable-pip-version-check uv
      - run: uv sync --frozen
      # `|| [ $? -eq 5 ]` tolerates pytest's exit-5 ("no tests collected") — this
      # is the bash idiom the `defaults.run.shell: bash` above exists for.
      - run: uv run pytest -q || [ $? -eq 5 ]
