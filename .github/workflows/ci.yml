name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the PRODUCTION platform for this MCP server, which runs
        # locally on Windows, but Linux CI still matters for PRs.
        os: [ubuntu-latest, windows-latest]

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      # ffmpeg is required for QR-video archival encodes.
      - name: Install ffmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # choco exits 0 when it cannot reach its feed, and the job then fails later with a
      # test error that does not name the cause. The step checks that ffmpeg runs, and tries again.
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: |
          for attempt in 1 2 3; do
            if choco install jq -y && ffmpeg -version; then exit 0; fi
            echo "ffmpeg is not usable after attempt $attempt" >&2
            sleep 20
          done
          exit 1

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
