name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the PRODUCTION platform for this MCP server, which runs
        # locally on Windows, but Linux CI still matters for PRs.
        os: [ubuntu-latest, windows-latest]

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      # ffmpeg is required for QR-video archival encodes.
      - name: Install ffmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  # The `test` job pins Bun 1.4.2, the declared floor. This job runs the current Bun release on
  # Windows, where the server runs. It is not a required check, so a new Bun release can turn it
  # red without blocking a merge. A call that works on the floor and throws on the current
  # release, such as mkdirSync with ".", then shows up here.
  test-current-bun:
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      # ffmpeg is required for QR-video archival encodes.
      - name: Install ffmpeg
        run: choco install ffmpeg -y

      - run: bun --version
      - run: bun install --frozen-lockfile
      - run: bun test
